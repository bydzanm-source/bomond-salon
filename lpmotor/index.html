<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- bomond:head -->
    <link rel="icon" href="/favicon.png" type="image/png" />
    <script>
      (() => {
        const isTelegramLaunch =
          /(?:^|[#?&])tgWebApp(?:Data|Platform|Version|ThemeParams)=/;
        let resumedInTelegram = false;
        try {
          const saved = JSON.parse(
            sessionStorage.getItem("__telegram__initParams") || "null",
          );
          resumedInTelegram = Boolean(
            saved?.tgWebAppData || saved?.tgWebAppPlatform,
          );
        } catch {
          // Restricted browser storage does not affect a fresh Mini App launch.
        }
        if (
          !isTelegramLaunch.test(location.hash) &&
          !isTelegramLaunch.test(location.search) &&
          !window.TelegramWebviewProxy &&
          !/Telegram-Android\//.test(navigator.userAgent) &&
          !resumedInTelegram
        )
          return;
        const script = document.createElement("script");
        script.id = "telegram-sdk";
        script.src = "https://telegram.org/js/telegram-web-app.js";
        document.head.append(script);
      })();
    </script>
    <script>
      const preferredTheme = matchMedia("(prefers-color-scheme: dark)").matches
        ? "dark"
        : "light";
      let savedTheme;
      try {
        savedTheme = localStorage.getItem("bomond-theme");
      } catch {
        // Use the browser preference when storage is unavailable.
      }
      document.documentElement.dataset.theme =
        savedTheme === "light" || savedTheme === "dark"
          ? savedTheme
          : preferredTheme;
    </script>
  </head>
  <body>
    <div id="root"><!-- bomond:app --></div>
    <script type="module" src="/src/app/client.tsx"></script>
  </body>
</html>
